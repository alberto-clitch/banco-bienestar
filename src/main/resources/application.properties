server.port=8080
spring.application.name=bancobienestar

spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8





# configuracion de la base de datos 
spring.datasource.url=jdbc:mysql://localhost:3306/bienestar_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Mmg2017032
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuracion de subida de archivos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Logging - Nivel DEBUG para el servicio PDF
logging.level.com.example.bancobienestar.service.PdfGeneratorService=DEBUG
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
